menu-main-item:
  name: "&3Welcome to Atlas"
  lore:
    - "§8Atlas"
    - ""
    - "&7Atlas is an easy to use quest book interface"
    - "&7Which supports full in-game chapter and quest editing"
    - "&7with requirements, rewards and personalization."
    - ""
    - "&7All regular (&) color codes and hex codes work."
    - "&7Preferred hex format: &a<#rrggbb> &7but others may work too."